<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Praktikum CSS Advanced</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family:Arial, sans-serif;
    background:#f4f4f4;
}
.navbar {
    position:fixed;
    top:0;
    width:100%;
    background:#1565C0;
    color:white;
    padding:15px 20px;
    transition:background 0.3s ease;
}
.navbar.scrolled {
    background:#0D47A1;
}
.navbar a {
    color:white;
    text-decoration:none;
    margin-left:15px;
}
.hero {
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:#42A5F5;
    color:white;
}
@keyframes fadeIn {
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
.hero h1 {
    animation:fadeIn 1s ease;
}
.hero p {
    animation:fadeIn 1.5s ease;
}
@keyframes pulse {
    0%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.1);
    }
    100%{
        transform:scale(1);
    }
}
.btn {
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:white;
    color:#1565C0;
    cursor:pointer;
    animation:pulse 2s infinite;
    transition:
    background 0.3s ease,
    transform 0.3s ease;
}
.btn:hover {
    background:#0D47A1;
    color:white;
    transform:scale(1.05);
}
.section {
    padding:60px 20px;
    text-align:center;
}
.card-container {
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    margin-top:20px;
}
.card {
    width:200px;
    background:white;
    padding:20px;
    border-radius:10px;
    transition:
    transform 0.3s ease,
    box-shadow 0.3s ease;
}
.card:hover {
    transform:scale(1.05);
    box-shadow:0 5px 10px rgba(0,0,0,0.2);
}
@keyframes spin {
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}
.spinner {
    width:50px;
    height:50px;
    border:5px solid #ddd;
    border-top:5px solid #1565C0;
    border-radius:50%;
    margin:20px auto;
    animation:spin 1s linear infinite;
}
@keyframes naikTurun {
    0%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-20px);
    }
    100%{
        transform:translateY(0);
    }
}
.bintang {
    font-size:60px;
    animation:naikTurun 2s infinite;
}
</style>
</head>
<body>
<div class="navbar" id="navbar">
    CSS Advanced
    <a href="#">Home</a>
    <a href="#">Produk</a>
    <a href="#">Kontak</a>
</div>
<section class="hero">
    <h1>Selamat Datang</h1>
    <p>
        Praktikum CSS Transition,
        Transform dan Animation
    </p>
    <button class="btn">
        Mulai Belajar
    </button>
</section>
<section class="section">
    <h2>Produk Unggulan</h2>
    <div class="card-container">
        <div class="card">
            <h3>Laptop</h3>
            <p>Performa tinggi</p>
        </div>
        <div class="card">
            <h3>Keyboard</h3>
            <p>Nyaman digunakan</p>
        </div>
        <div class="card">
            <h3>Mouse</h3>
            <p>Presisi tinggi</p>
        </div>
        <div class="card">
            <h3>Monitor</h3>
            <p>Tampilan tajam</p>
        </div>
    </div>
</section>
<section class="section">
    <h2>Loading Spinner</h2>
    <div class="spinner"></div>
</section>
<!-- Animasi Kreatif -->
<section class="section">
    <h2>Animasi Kreatif</h2>
    <div class="bintang">
        ⭐
    </div>
</section>
<script>
window.addEventListener("scroll", function(){
    let navbar =
    document.getElementById("navbar");
    if(window.scrollY > 50){
        navbar.classList.add("scrolled");
    }else{

        navbar.classList.remove("scrolled");
    }
});
</script>
</body>
</html>
