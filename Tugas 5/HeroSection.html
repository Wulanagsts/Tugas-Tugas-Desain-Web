<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Section</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    section {
      position: relative;
      height: 100vh;
      font-family: Georgia, serif;
    }

    picture img {
      width: 100%;
      height: 100vh;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    header {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(30, 40, 80, 0.38);
      color: white;
      gap: 1rem;
      padding: 1rem;
    }

    h1 { font-size: 4rem; font-weight: bold; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    p  { font-size: 1.5rem; opacity: 0.92; }

    @media (max-width: 1023px) {
      h1 { font-size: 2rem; }
      p  { font-size: 1rem; }
    }

    @media (max-width: 599px) {
      h1 { font-size: 1.5rem; }
      p  { font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <section aria-label="Hero">
    <picture>
  <source
    srcset="https://i.pinimg.com/736x/34/ee/d7/34eed7b9fc24ecbb1abb4bf02a3a7b5a.jpg?auto=format&fit=crop&w=1920&q=80"
    media="(min-width: 1024px)">

  <source
    srcset="https://i.pinimg.com/1200x/fd/30/de/fd30de1388652654a761fa1cb36d7ad0.jpg?auto=format&fit=crop&w=1024&q=80"
    media="(min-width: 600px)">

  <img
    src="https://i.pinimg.com/736x/92/3e/8b/923e8ba88fb3f39dde4c775aaec129a0.jpg?auto=format&fit=crop&w=600&h=900&q=80"
    alt="Pemandangan Alam">
</picture>

    <header>
      <h1>welcome to my website</h1>
      <p>Di mana tinta menetes menjadi makna, dan kata-kata menemukan rumahnya dalam sajak.</p>
    </header>
  </section>

</body>
</html>
