<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Kontak</title>
</head>
<body>
    <header style="text-align:center;">
        <h1>Hubungi Kami</h1>
        <nav>
            <a href="Beranda.html">Beranda</a> |
            <a href="gallery.html">Galeri</a> |
            <a href="form.html">Kontak</a>
        </nav>
    </header>
    <hr>

    <main>
        <article>
            <section>
                <header>
                <h2>Kirim Pesan ke Ruang Seduh</h2>
                    <p>Silakan isi formulir di bawah ini untuk menghubungi kami.</p> 
                </header>
                
                <form action="#" method="post" enctype="multipart/form-data">
                    <fieldset>
                        <legend>Data Pelanggan</legend>

                        <label for="nama">Nama Lengkap:</label><br>
                        <input type="text" id="nama" name="nama" placeholder="Masukan Nama Lengkap" required><br><br>
                        <label for="email">Email:</label><br>
                        <input type="email" id="email" name="email" placeholder="contoh@email.com" required><br><br>
                        <label>Jenis Kelamin:</label><br>
                        <input type="radio" id="pria" name="gender" value="Pria">
                        <label for="pria">Pria</label>
                        <input type="radio" id="wanita" name="gender" value="Wanita">
                        <label for="wanita">Wanita</label>
                    </fieldset><br>
        
                    <fieldset>
                        <legend>Detail Pesanan Kopi</legend>

                        <label>Produk yang ingin dibeli:</label><br>
                        <input type="checkbox" id="arabica" name="produk" value="arabica">
                        <label for="arabica">Arabica Banyuwangi</label>
                        <input type="checkbox" id="robusta" name="produk" value="robusta">
                        <label for="robusta">Robusta Ijen</label>
                        <input type="checkbox" id="Houseblend" name="produk" value="houseblend">
                        <label for="houseblend">House Blend Ruang Seduh</label><br><br>
                        

                        <label for="berkas">Unggah Bukti Pembayaran:</label><br>
                        <input type="file" id="berkas" name="berkas" accept="image/*"><br><br>

                        <label for="pesan">Catatan untuk barista:</label><br>
                        <textarea id="pesan" name="pesan" rows="4" cols="40" placeholder="Contoh:Biji kopi di giling kasar......"></textarea>
                    </fieldset><br>

                        <button type="submit">Kirim Pesanan</button>
                        <button type="reset">Batalkan</button>    
                </form>
            </section>
        </article>
    </main>

    <hr>
    <footer style="text-align:center;">
        <p><strong>&copy; 2026 Ruang Seduh - Banyuwangi</strong></p>
    </footer>
</body>
</html>
